app.id=com.saucelabs.mydemo.app.ios
# Optional; empty = use the app already installed on the simulator. Override per run: -Dapp.path=... (make APP=...)
app.path=

# Per detected simulator: WebDriverAgent wdaLocalPort and mjpegServerPort, counted up from these.
device.driverPortBase=8100
device.mjpegPortBase=9100

# WebDriverAgent sometimes refuses connections right after the previous session ended.
wda.startupRetries=3
wda.startupRetryIntervalSeconds=10

simulator.connectHardwareKeyboard=true

# Fallback locators depend on visible text (CLAUDE.md §4.1). Verified, not set: setting language/locale
# capabilities restarts SpringBoard on every session, which randomly kills WebDriverAgent.
simulator.expectedLocale=en_US
