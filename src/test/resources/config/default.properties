# A server already running at this address is reused and left running.
appium.host=127.0.0.1
appium.port=4723
appium.server.startTimeoutSeconds=60

# Passed only to the Appium server process. Empty = auto-detect.
appium.env.androidHome=
appium.env.javaHome=

timeout.defaultSeconds=15
timeout.launchSeconds=120
timeout.pollingMillis=250
session.newCommandTimeoutSeconds=120

session.noReset=false

# Empty = use the running Android emulators/devices or booted iOS simulators.
# Set to a classpath file (e.g. config/devices.json) to pin devices and ports.
devices.file=
